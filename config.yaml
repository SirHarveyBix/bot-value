telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  parse_mode: "HTML"
  disable_web_page_preview: true

scanner:
  min_market_cap: 500000000
  min_volume_20j: 1000000
  min_price: 5.0
  max_data_age_days: 110
  min_valid_data_ratio: 0.60

scoring:
  weights:
    quality: 0.35
    valuation: 0.30
    momentum: 0.35
  quality_subweights:
    roe: 0.35
    margin: 0.30
    fcf_yield: 0.25
    debt_ebitda: 0.10
  valuation_subweights:
    pe_forward: 0.45
    ev_ebitda: 0.35
    peg: 0.20
  momentum_subweights:
    perf_6m: 0.30
    outperf_6m: 0.35
    perf_3m: 0.20
    eps_revision: 0.15
