telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  parse_mode: "HTML"
  disable_web_page_preview: true

scanner:
  min_market_cap: 2000000000
  min_volume_20j: 5000000
  min_price: 5.0
  max_tickers_per_sector: 3
  max_data_age_days: 180
  min_valid_data_ratio: 0.60
  inter_request_delay: 1.0
  max_workers_universe: 4
  fmp_api_key: ${FMP_API_KEY}
  fmp_base_url: "https://financialmodelingprep.com/stable"
  shortlist_size: 30
  shortlist_sector_cap: 5
  vix_panic_threshold: 35
  vix_warning_threshold: 25
  fmp_max_retries: 2
  fmp_call_budget_hard_limit: 175
  yfinance_chunk_size: 100
  yfinance_chunk_delay_s: 2.0
  cache_ttl_fundamentals: 604800 # 7 jours — fondamentaux FMP mis à jour trimestriellement, cache hebdomadaire préserve le quota 250 calls/jour
  cache_ttl_prices: 14400
  min_universe_size: 100
  telegram_max_chars: 4096
  min_tickers_intra_sector: 3
  data_freshness_warning_days: 450 # IS/BS FMP annuels — exercice fiscal décalé (ex: MU=août) → 270j normal (spec originale: 365)
  data_freshness_exclusion_days: 700 # Absorbe bilan fiscal décalé + délai publication FMP (spec originale: 450)
  earnings_window_days: 14
  exit_rank_threshold: 15
  exit_score_threshold: 70.0
  maturation_days: 3
  insider_buy_days: 90
  insider_buy_threshold: 50000
  insider_buy_bonus_max: 5.0

scoring:
  weights:
    quality: 0.35
    valuation: 0.30
    momentum: 0.35
  quality_subweights:
    roe: 0.40
    margin: 0.35
    fcf_yield: 0.15
    debt_ebitda: 0.10
  valuation_subweights:
    pe_forward: 0.45
    ev_ebitda: 0.35
    peg: 0.20
  momentum_subweights:
    perf_6m: 0.30
    outperf_6m: 0.30
    perf_3m: 0.15
    surprise_earnings: 0.15
    analyst_revision: 0.10
