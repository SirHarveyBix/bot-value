telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  parse_mode: "HTML"
  disable_web_page_preview: true

scanner:
  min_market_cap: 2000000000
  min_volume_20j: 5000000
  min_price: 5.0
  max_tickers_per_sector: 3
  max_data_age_days: 180
  min_valid_data_ratio: 0.60
  inter_request_delay: 1.0
  max_workers: 2
  fmp_api_key: ${FMP_API_KEY}
  fmp_base_url: "https://financialmodelingprep.com/api/v3"

scoring:
  weights:
    quality: 0.40
    valuation: 0.25
    momentum: 0.35
  quality_subweights:
    roe: 0.40
    margin: 0.35
    fcf_yield: 0.15
    debt_ebitda: 0.10
  valuation_subweights:
    pe_forward: 0.45
    ev_ebitda: 0.35
    peg: 0.20
  momentum_subweights:
    perf_6m: 0.30
    outperf_6m: 0.35
    perf_3m: 0.20
    sales_growth: 0.15
